# ==============================================================================
# SupportDesk — Docker Compose Local Development & Production Orchestration
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: supportdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supportdesk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportdesk_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-supportdesk}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supportdesk_user} -d ${POSTGRES_DB:-supportdesk}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - supportdesk-network

  # ----------------------------------------------------------------------------
  # 2. Redis Caching & Distributed Rate-Limiting Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: supportdesk-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - supportdesk-network

  # ----------------------------------------------------------------------------
  # 3. SupportDesk API Service (Express + Prisma)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: supportdesk-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-supportdesk_user}:${POSTGRES_PASSWORD:-supportdesk_dev_password}@postgres:5432/${POSTGRES_DB:-supportdesk}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-supportdesk_dev_jwt_secret_key_minimum_32_characters_long}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-3.5-flash-lite}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1000}
      AUTO_MIGRATE: "true"
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - supportdesk-network

  # ----------------------------------------------------------------------------
  # 4. SupportDesk Web Client (React + Nginx SPA)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api/v1}
    container_name: supportdesk-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - supportdesk-network

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: supportdesk_postgres_data
  redis_data:
    name: supportdesk_redis_data

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  supportdesk-network:
    name: supportdesk-network
    driver: bridge
