services:
  postgres:
    image: postgres:17
    container_name: supportdesk-postgres
    environment:
      POSTGRES_DB: supportdesk
      POSTGRES_USER: supportdesk_user
      POSTGRES_PASSWORD: supportdesk_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - supportdesk_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportdesk_user -d supportdesk"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  supportdesk_postgres_data:
